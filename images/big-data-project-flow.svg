<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="title description">
  <title id="title">Recorrido del proyecto de análisis de pasajeros</title>
  <desc id="description">Un conjunto mensual de datos de pasajeros de SFO alimenta tres partes del trabajo: exploración con PySpark, ejercicios de regresión y preparación de datos para Cassandra.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8290a3" />
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { fill: #17283d; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #526174; font-size: 16px; }
      .card-title { fill: #17283d; font-size: 22px; font-weight: 700; }
      .body { fill: #39495d; font-size: 16px; }
      .small { fill: #607086; font-size: 14px; }
      .tag { font-size: 13px; font-weight: 700; letter-spacing: .5px; }
    </style>
  </defs>

  <rect width="1280" height="650" rx="28" fill="#f3f6f9" />
  <text x="64" y="62" class="title">Del conjunto de datos al análisis</text>
  <text x="64" y="91" class="subtitle">Proyecto final sobre las estadísticas mensuales de pasajeros del aeropuerto de San Francisco (SFO)</text>

  <rect x="390" y="120" width="500" height="98" rx="18" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" />
  <rect x="412" y="141" width="60" height="54" rx="12" fill="#e5f4f2" />
  <path d="M428 154h28v27h-28z M434 149h28v27" fill="none" stroke="#168b82" stroke-width="3" stroke-linejoin="round" />
  <text x="492" y="158" class="card-title">CSV de pasajeros</text>
  <text x="492" y="185" class="body">San Francisco Open Data · recuentos mensuales</text>

  <path d="M640 218v28M220 246h840" fill="none" stroke="#8290a3" stroke-width="2.5" />
  <path d="M220 246v32" fill="none" stroke="#8290a3" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M640 246v32" fill="none" stroke="#8290a3" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M1060 246v32" fill="none" stroke="#8290a3" stroke-width="2.5" marker-end="url(#arrow)" />

  <g>
    <rect x="60" y="292" width="320" height="260" rx="18" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" />
    <path d="M78 292h284a18 18 0 0 1 18 18v6H60v-6a18 18 0 0 1 18-18z" fill="#168b82" />
    <rect x="84" y="338" width="118" height="28" rx="14" fill="#e5f4f2" />
    <text x="102" y="357" class="tag" fill="#14766f">PYSPARK</text>
    <text x="84" y="405" class="card-title">Explorar</text>
    <text x="84" y="440" class="body">Revisar tipos, valores ausentes</text>
    <text x="84" y="465" class="body">y distribución de los registros.</text>
    <text x="84" y="505" class="small">Comparaciones por región, año</text>
    <text x="84" y="527" class="small">y aerolínea.</text>
  </g>

  <g>
    <rect x="480" y="292" width="320" height="260" rx="18" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" />
    <path d="M498 292h284a18 18 0 0 1 18 18v6H480v-6a18 18 0 0 1 18-18z" fill="#d4a62f" />
    <rect x="504" y="338" width="118" height="28" rx="14" fill="#fbf2d8" />
    <text x="522" y="357" class="tag" fill="#8b6813">REGRESIÓN</text>
    <text x="504" y="405" class="card-title">Probar modelos</text>
    <text x="504" y="440" class="body">Ajustar regresiones lineales con</text>
    <text x="504" y="465" class="body">calendario y variables categóricas.</text>
    <text x="504" y="505" class="small">Separación aleatoria 80/20;</text>
    <text x="504" y="527" class="small">no es una prueba temporal.</text>
  </g>

  <g>
    <rect x="900" y="292" width="320" height="260" rx="18" fill="#ffffff" stroke="#d9e1e9" stroke-width="2" />
    <path d="M918 292h284a18 18 0 0 1 18 18v6H900v-6a18 18 0 0 1 18-18z" fill="#5277a8" />
    <rect x="924" y="338" width="118" height="28" rx="14" fill="#eaf0f8" />
    <text x="942" y="357" class="tag" fill="#395b88">CASSANDRA</text>
    <text x="924" y="405" class="card-title">Preparar datos</text>
    <text x="924" y="440" class="body">Tratar valores ausentes y crear</text>
    <text x="924" y="465" class="body">un archivo para la carga.</text>
    <text x="924" y="505" class="small">Ejercicio de almacenamiento</text>
    <text x="924" y="527" class="small">en el entorno del curso.</text>
  </g>

  <text x="64" y="606" class="small">Los datos están agregados: una fila del CSV no equivale a un vuelo individual.</text>
</svg>
